services:
  postgres:
    image: postgres:18
    container_name: ai-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_chat
      POSTGRES_PASSWORD: ai_chat_password
      POSTGRES_DB: ai_chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: